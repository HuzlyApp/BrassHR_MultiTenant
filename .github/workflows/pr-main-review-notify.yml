# Email reviewers when a PR is opened (or reopened) against main.
# Reviewers open the PR link and Approve on GitHub; ruleset then allows merge.
#
# Required secrets:
#   RESEND_API_KEY
#   MIGRATION_NOTIFY_TO   (reuse: app@huzly.com,dan@zipstaff.com)
# Optional:
#   MIGRATION_NOTIFY_FROM

name: PR Main Review Notify

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: Email reviewers
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send review request email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MIGRATION_NOTIFY_TO: ${{ secrets.MIGRATION_NOTIFY_TO }}
          MIGRATION_NOTIFY_FROM: ${{ secrets.MIGRATION_NOTIFY_FROM }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: node scripts/pr-main-review-notify.mjs
